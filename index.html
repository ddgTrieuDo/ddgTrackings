<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DDG Tracking Web</title>
  <link rel="stylesheet" href="./styles.css?v=4.9" />
</head>
<body>
<div id="app">
  <section id="loginView" class="login-shell">
    <div class="login-card">
      <div class="brand-row"><div class="brand-badge">DDG</div><div><h1>Tracking</h1><p>DDG Management Web</p></div></div>
      <label>Email</label><input id="loginEmail" type="email" autocomplete="username" placeholder="name@company.com">
      <label>Password</label><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Password">
      <button id="loginBtn" class="primary full">Login</button><div id="loginMsg" class="msg"></div><div class="login-version">Web 4.9 · Project Creation Sync</div>
    </div>
  </section>

  <div id="mainView" class="app-shell hidden">
    <header class="titlebar"><div class="title-brand"><span class="mini-logo">DDG</span><b>Tracking</b></div><div class="web-badge">WEB</div></header>
    <aside class="sidebar">
      <nav id="nav">
        <button data-page="dashboard" class="nav-btn active"><span>⌂</span>Dashboard</button>
        <button data-page="jobs" class="nav-btn"><span>▣</span>Jobs</button>
        <button data-page="tasks" class="nav-btn"><span>☷</span>Tasks</button>
        <button data-page="production" class="nav-btn"><span>▥</span>Production</button>
        <button data-page="screenshots" class="nav-btn"><span>▧</span>Screenshots</button>
        <button data-page="attendance" class="nav-btn"><span>▦</span>Attendance</button>
        <button data-page="monitor" id="monitorNav" class="nav-btn hidden"><span>▱</span>Monitor</button>
        <button data-page="employees" id="employeesNav" class="nav-btn hidden"><span>♙</span>Employees</button>
      </nav>
      <div class="sidebar-bottom">
        <button data-page="settings" class="nav-btn"><span>⚙</span>Settings</button>
        <button data-page="about" class="nav-btn"><span>?</span>About</button>
        <div id="userSummary" class="user-summary"></div>
        <button id="logoutBtn" class="nav-btn danger-text">Logout</button>
      </div>
    </aside>
    <main class="main">
      <div class="content-head"><div><h1 id="pageTitle">Dashboard</h1><p id="pageSubtitle">Project portfolio overview</p></div><div class="head-actions"><span id="syncStatus" class="pill">Ready</span><button id="reloadBtn" class="primary">Reload</button></div></div>
      <section id="page-dashboard" class="page"></section>
      <section id="page-jobs" class="page hidden"></section>
      <section id="page-tasks" class="page hidden"></section>
      <section id="page-production" class="page hidden"></section>
      <section id="page-screenshots" class="page hidden"></section>
      <section id="page-attendance" class="page hidden"></section>
      <section id="page-monitor" class="page hidden"></section>
      <section id="page-employees" class="page hidden"></section>
      <section id="page-settings" class="page hidden"></section>
      <section id="page-about" class="page hidden"></section>
    </main>
  </div>
</div>
<div id="modalBackdrop" class="modal-backdrop hidden"><div id="modal" class="modal"></div></div>
<script>
(function () {
  const loginMsg = () => document.getElementById('loginMsg');
  const setMsg = (m) => { const e = loginMsg(); if (e) e.textContent = m; };
  const sources = [
    'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
    'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
  ];
  function loadScript(url) {
    return new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = url;
      s.async = false;
      s.onload = resolve;
      s.onerror = () => reject(new Error('Failed to load ' + url));
      document.head.appendChild(s);
    });
  }
  window.addEventListener('error', e => { setMsg('JavaScript error: ' + (e.message || 'Unknown error')); });
  window.addEventListener('unhandledrejection', e => { const r=e.reason; setMsg('JavaScript error: ' + (r?.message || String(r || 'Unhandled promise rejection'))); });
  async function boot() {
    setMsg('Loading authentication...');
    let loaded = false;
    for (const url of sources) {
      try {
        await loadScript(url);
        if (window.supabase && typeof window.supabase.createClient === 'function') {
          loaded = true;
          break;
        }
      } catch (e) {
        console.warn(e);
      }
    }
    if (!loaded) {
      setMsg('Cannot load Supabase library. Please check internet/CDN access.');
      return;
    }
    try {
      await loadScript('./app.js?v=4.9');
      if (loginMsg() && loginMsg().textContent === 'Loading authentication...') setMsg('');
    } catch (e) {
      console.error(e);
      setMsg('Web app failed to start. Open F12 > Console for details.');
    }
  }
  boot();
})();
</script>
</body>
</html>
