/* Web 4.19 - Consistent interactive states across the entire web app */
button{
  transition:background-color .16s ease,border-color .16s ease,color .16s ease,box-shadow .16s ease,transform .16s ease;
}
button:not(:disabled):hover{
  background:#f8fafc;
  color:#1d2939;
}
button:focus-visible{
  outline:2px solid #84adff;
  outline-offset:2px;
}
button:disabled,
button[disabled]{
  opacity:1;
  cursor:not-allowed;
  background:#f2f4f7 !important;
  border-color:#d0d5dd !important;
  color:#667085 !important;
  box-shadow:none !important;
  transform:none !important;
}
button.primary,
.primary{
  background:var(--blue);
  border-color:var(--blue);
  color:#fff;
}
button.primary:not(:disabled):hover,
.primary:not(:disabled):hover{
  background:#245fd6;
  border-color:#245fd6;
  color:#fff;
}
button.primary:active:not(:disabled),
.primary:active:not(:disabled){
  background:#1f56c2;
  border-color:#1f56c2;
  color:#fff;
}
button.primary:disabled,
.primary:disabled{
  background:#e4e7ec !important;
  border-color:#d0d5dd !important;
  color:#667085 !important;
}
button.danger{
  background:#fff;
  border-color:#ff99a5;
  color:var(--red);
}
button.danger:not(:disabled):hover{
  background:#fff1f3;
  border-color:#f97080;
  color:#c92a3a;
}
button.success{
  background:#fff;
  border-color:#8bd9be;
  color:#087f5b;
}
button.success:not(:disabled):hover{
  background:#ecfdf6;
  border-color:#6bc8a8;
  color:#067053;
}
.nav-btn:not(:disabled):hover,
.nav-btn.active,
.nav-btn.active:not(:disabled):hover{
  background:#2f6fed;

      async function loginWithRestFallback(email,password){
        const ctrl=new AbortController();
        const timer=setTimeout(()=>ctrl.abort(),20000);
        try{
          const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
            method:'POST',
            signal:ctrl.signal,
            headers:{
              'apikey':SUPABASE_KEY,
              'Authorization':`Bearer ${SUPABASE_KEY}`,
              'Content-Type':'application/json'
            },
            body:JSON.stringify({email,password})
          });
          const raw=await r.text();
          let body={};
          try{body=raw?JSON.parse(raw):{}}catch{body={message:raw}}
          if(!r.ok){
            const m=body?.msg||body?.message||body?.error_description||body?.error||`HTTP ${r.status}`;
            throw new Error(`Supabase Auth: ${m} (HTTP ${r.status})`);
          }
          if(!body.access_token||!body.refresh_token) throw new Error('Supabase Auth returned no session token.');
          const {data,error}=await sb.auth.setSession({access_token:body.access_token,refresh_token:body.refresh_token});
          if(error) throw error;
          return data;
        }finally{clearTimeout(timer)}
      }
      
      $('#loginBtn').onclick=async()=>{
        const btn=$('#loginBtn'), msg=$('#loginMsg');
        const email=$('#loginEmail').value.trim();
        const password=$('#loginPassword').value;
        msg.textContent='';
        if(!email||!password){msg.textContent='Please enter email and password.';return;}
        btn.disabled=true; btn.textContent='Signing in...';
        try{
          let data=null;
          let sdkError=null;
          try{
            const result=await Promise.race([
              sb.auth.signInWithPassword({email,password}),
              new Promise((_,reject)=>setTimeout(()=>reject(new Error('Supabase SDK login timed out.')),15000))
            ]);
            if(result?.error) sdkError=result.error; else data=result?.data||null;
          }catch(e){sdkError=e}
      
          if(!data?.user){
            console.warn('Supabase SDK login failed; trying direct Auth REST endpoint.',sdkError);
            msg.textContent='Retrying authentication...';
            data=await loginWithRestFallback(email,password);
          }
          if(!data?.user){
            const {data:ud,error:ue}=await sb.auth.getUser();
            if(ue) throw ue;
            data={user:ud?.user};
          }
          if(!data?.user) throw new Error('Login succeeded but no user session was returned.');
          msg.textContent='Login successful. Loading data...';
          await showMain(data.user);
        }catch(e){
          console.error('Login error',e);
          msg.textContent=e?.name==='AbortError'?'Connection to Supabase timed out.':(e?.message||'Unable to connect to Supabase.');
        }finally{btn.disabled=false;btn.textContent='Login';}
      };

      function renderMonitor(){if(!roleIsManager()){$('#page-monitor').innerHTML='<div class="notice">Admin/Manager access required.</div>';return}const people=state.profiles.filter(p=>p.active!==false);$('#page-monitor').innerHTML=`<div class="toolbar"><div class="field"><label>Employee</label><select id="monEmp">${people.map(p=>`<option value="${p.id}">${esc(nameOf(p.id))} (${esc(p.employee_id||'')}) · ${esc(p.role||'Employee')}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="monDate" type="date" value="${isoDay()}"></div><button id="monLoad" class="primary">Reload</button></div><div id="monInfo" class="muted small"></div><div id="monShots" class="screenshot-grid" style="margin-top:12px"></div>`;$('#monLoad').onclick=loadMonitor;$('#monEmp').onchange=loadMonitor;$('#monDate').onchange=loadMonitor;loadMonitor()}
      async function loadMonitor(){const uid=$('#monEmp').value,day=$('#monDate').value,shots=state.screenshots.filter(s=>s.user_id===uid&&String(s.captured_at||'').slice(0,10)===day).sort((a,b)=>new Date(b.captured_at)-new Date(a.captured_at));$('#monInfo').textContent=`${nameOf(uid)}: ${shots.length} screenshots on ${day}.`;await drawShotCards(shots,$('#monShots'))}
      
      function renderEmployees(){if(!roleIsAdmin()){$('#page-employees').innerHTML='<div class="notice">Admin access required.</div>';return}const rows=state.profiles;$('#page-employees').innerHTML=`<div class="toolbar"><button id="newEmployee">+ New Employee</button><div class="field grow"><label>Search</label><input id="empSearch" placeholder="Search employee..."></div></div><div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">${[['Employees',rows.length],['Active',rows.filter(x=>x.active!==false).length],['Admins',rows.filter(x=>x.role==='Admin').length],['Managers',rows.filter(x=>x.role==='Manager').length]].map(([l,v])=>`<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Employee ID</th><th>Group</th><th>Email</th><th>Role</th><th>Annual Leave</th><th>Used</th><th>Remaining</th><th>Status</th><th>Action</th></tr></thead><tbody>${rows.map(p=>{const e=num(p.annual_leave_days),u=usedLeave(p.id);return`<tr data-emp-row data-search="${esc([p.display_name,p.employee_id,p.work_group,p.email,p.role].join(' ').toLowerCase())}"><td>${esc(nameOf(p.id))}</td><td>${esc(p.employee_id||'—')}</td><td>${esc(p.work_group||'—')}</td><td>${esc(p.email||'—')}</td><td>${esc(p.role||'Employee')}</td><td>${fmt(e)}</td><td>${fmt(u)}</td><td>${fmt(Math.max(0,e-u))}</td><td>${p.active===false?'Inactive':'Active'}</td><td><button data-edit-emp="${p.id}">Edit</button> <button class="${p.active===false?'success':'danger'}" data-toggle-emp="${p.id}">${p.active===false?'Activate':'Deactivate'}</button></td></tr>`}).join('')}</tbody></table></div>`;$('#newEmployee').onclick=()=>employeeModal();$('#empSearch').oninput=e=>{const q=e.target.value.toLowerCase();$$('[data-emp-row]').forEach(r=>r.classList.toggle('hidden',q&&!r.dataset.search.includes(q)))};$$('[data-edit-emp]').forEach(b=>b.onclick=()=>employeeModal(prof(b.dataset.editEmp)));$$('[data-toggle-emp]').forEach(b=>b.onclick=()=>toggleEmployee(b.dataset.toggleEmp))}
      async function createAuthEmployee(email,password,metadata){const temp=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await temp.auth.signUp({email,password,options:{data:metadata}});try{await temp.auth.signOut()}catch{}if(error)throw error;return data.user}
      function employeeModal(p=null){modal(p?'Edit Employee':'New Employee',`<div class="form-grid"><div class="field"><label>Display Name</label><input id="eName" value="${esc(p?.display_name||'')}"></div><div class="field"><label>Employee ID</label><input id="eId" value="${esc(p?.employee_id||'')}"></div><div class="field"><label>Group</label><input id="eGroup" list="employeeGroupList" placeholder="DN, TH, TN, PT, TD or type another" value="${esc(p?.work_group||'')}"><datalist id="employeeGroupList"><option value="DN"><option value="TH"><option value="TN"><option value="PT"><option value="TD"></datalist></div><div class="field"><label>Email</label><input id="eEmail" type="email" value="${esc(p?.email||'')}" ${p?'readonly':''}></div><div class="field"><label>Role</label><select id="eRole">${['Employee','Manager','Admin'].map(r=>`<option ${p?.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Annual Leave Days</label><input id="eLeave" type="number" step="0.5" min="0" value="${num(p?.annual_leave_days)}"></div>${p?'':`<div class="field"><label>Temporary Password</label><input id="ePass" type="password"></div>`}</div>`,async()=>{let uid=p?.id;const row={display_name:$('#eName').value.trim(),employee_id:$('#eId').value.trim(),work_group:$('#eGroup').value.trim().toUpperCase(),email:$('#eEmail').value.trim().toLowerCase(),role:$('#eRole').value,annual_leave_days:num($('#eLeave').value),active:p?.active!==false};if(!p){try{const u=await createAuthEmployee(row.email,$('#ePass').value,{display_name:row.display_name,employee_id:row.employee_id,work_group:row.work_group});uid=u?.id}catch(e){return alert(e.message)}}for(let i=0;i<8&&!p;i++){const {data}=await sb.from('profiles').select('id').eq('id',uid).maybeSingle();if(data)break;await new Promise(r=>setTimeout(r,250))}const {error}=await sb.from('profiles').update(row).eq('id',uid);if(error)return alert(error.message);closeModal();await loadAll()})}
      async function toggleEmployee(uid){const p=prof(uid),next=p?.active===false;if(uid===state.profile.id&&!next)return alert('You cannot deactivate yourself.');const {error}=await sb.from('profiles').update({active:next}).eq('id',uid);if(error)alert(error.message);else loadAll()}
      
      function renderSettings(){$('#page-settings').innerHTML=`<div class="card" style="max-width:900px"><div class="section-title">Web Portal Settings</div><div class="notice">Tracking capture settings remain in the Windows desktop agent because a browser cannot monitor global keyboard/mouse activity, detect all desktop applications, or capture the entire desktop in the background.</div><div class="form-grid"><div class="field"><label>Supabase</label><input readonly value="Connected"></div><div class="field"><label>Portal</label><input readonly value="DDG Tracking Web"></div><div class="field"><label>Signed screenshot URL lifetime</label><input readonly value="10 minutes"></div></div></div>`}
      function renderAbout(){$('#page-about').innerHTML=`<div class="card" style="max-width:900px"><div class="section-title">DDG Tracking Web</div><p>Web management portal synchronized with the DDG Tracking Windows desktop agent through Supabase.</p><p><b>Shared management features:</b> Dashboard, Project Setup/List/Time, Change Orders, My Tasks, Task Management, Production, Screenshots, Attendance/Leave/Schedules, Team Monitor and Employee Management.</p><p><b>Desktop agent:</b> Start/Stop tracking, keyboard/mouse activity, active applications, automatic screenshots, offline/background tracking and system tray operation.</p><p class="muted">Version Web 4.38 My Tasks table - no Start/Stop</p></div>`}
      
      async function bootstrapAuth(){
        try{
          const {data,error}=await sb.auth.getSession();
          if(error) console.warn('Session restore error',error);
          if(data?.session?.user) await showMain(data.session.user);
        }catch(e){console.error('Auth bootstrap error',e);}
      }
      sb.auth.onAuthStateChange((event,session)=>{
        console.log('Auth state:',event);
        if(event==='SIGNED_OUT'){
          $('#mainView')?.classList.add('hidden');
          $('#loginView')?.classList.remove('hidden');
        }
      });
      bootstrapAuth();
      if (loginMsg() && loginMsg().textContent === 'Loading authentication...') setMsg('');
    } catch (e) {
      console.error(e);
      setMsg('Web app failed to start: ' + (e?.message || String(e)));
    }
  }
  boot();
})();
</script>
</body>
</html>
