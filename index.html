  <style>
:root{--bg:#f3f6fb;--panel:#fff;--text:#101828;--muted:#475467;--line:#d8dee8;--grid:#e5e9ef;--blue:#2f6fed;--blue2:#e6eeff;--nav:#162238;--green:#10a46f;--red:#db3c4b;--amber:#df9713;--shadow:0 1px 2px #1018280d}
*{box-sizing:border-box}html,body,#app{margin:0;min-height:100%;font-family:"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg)}button,input,select,textarea{font:inherit}.hidden{display:none!important}
.login-shell{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,94vw);background:#fff;border:1px solid var(--line);border-radius:12px;padding:28px;box-shadow:0 16px 48px #1720331a}.brand-row{display:flex;align-items:center;gap:12px;margin-bottom:22px}.brand-row h1{margin:0;font-size:24px}.brand-row p{margin:3px 0;color:var(--muted)}.brand-badge,.mini-logo{background:#fff;border:1px solid #d8dee8;border-radius:7px;object-fit:contain;display:block}.brand-badge{width:52px;height:52px;padding:4px}.mini-logo{width:32px;height:26px;padding:2px}.login-card label{display:block;font-weight:700;margin:12px 0 5px}.login-card input{width:100%;padding:10px;border:1px solid var(--line);border-radius:4px}.full{width:100%;margin-top:18px}.msg{color:var(--red);margin-top:10px;min-height:18px}
.app-shell{display:grid;grid-template-columns:160px 1fr;grid-template-rows:38px calc(100vh - 38px);grid-template-areas:"title title" "side main";min-height:100vh}.titlebar{grid-area:title;background:#fff;border-bottom:1px solid #e7ebf1;display:flex;align-items:center;justify-content:space-between;padding:0 12px}.title-brand{display:flex;align-items:center;gap:10px}.web-badge{font-size:10px;font-weight:800;color:#2f6fed;background:#edf3ff;border:1px solid #cbdafd;border-radius:999px;padding:4px 8px}.sidebar{grid-area:side;background:var(--nav);display:flex;flex-direction:column;min-height:0;padding:16px 8px}.sidebar nav{display:flex;flex-direction:column}.nav-btn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:#f5f8fd;text-align:left;padding:11px 13px;border-radius:8px;margin:3px 0;cursor:pointer}.nav-btn span{width:17px;text-align:center}.nav-btn:hover,.nav-btn.active{background:#2f6fed;color:#fff}.sidebar-bottom{margin-top:auto}.danger-text{color:#ffb7bf}.user-summary{padding:10px 12px;font-size:12px;line-height:1.45;color:#dbe5f5;border-top:1px solid #ffffff20;margin-top:8px}.main{grid-area:main;min-width:0;overflow:auto}.content-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:20px 24px 8px}.content-head h1{font-size:21px;margin:0}.content-head p{margin:4px 0;color:var(--muted);font-size:12px}.head-actions{display:flex;align-items:center;gap:8px}.page{padding:6px 24px 28px}.pill{background:#eef2f6;color:#344054;padding:5px 9px;border-radius:999px;font-size:12px}
button{border:1px solid var(--line);background:#fff;color:#1d2939;padding:7px 12px;border-radius:2px;cursor:pointer}button:hover{background:#f8fafc}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}button.danger{color:var(--red);border-color:#ff99a5}button.success{color:#087f5b;border-color:#8bd9be}.tabbar{display:flex;gap:8px;margin-bottom:14px}.tab-btn{border:0;background:transparent;padding:8px 14px;border-radius:8px}.tab-btn.active{background:#dfe8ff;color:#1e5bea;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px;box-shadow:var(--shadow)}.section-title{font-size:16px;font-weight:800;margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:12px}.grid{display:grid;gap:12px}.kpis{grid-template-columns:repeat(6,minmax(120px,1fr));margin-bottom:12px}.kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:13px}.kpi .label{font-size:11px;color:var(--muted)}.kpi .value{font-weight:800;font-size:23px;margin-top:5px}.two-col{grid-template-columns:1fr 1fr}.three-col{grid-template-columns:repeat(3,1fr)}
.toolbar{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap;margin-bottom:12px}.field{display:flex;flex-direction:column;gap:4px}.field label{font-size:11px;font-weight:700;color:#344054}.field input,.field select,.field textarea{border:1px solid #aeb7c4;background:#fff;border-radius:1px;padding:7px 8px;min-width:150px;color:#101828}.grow{flex:1}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(180px,1fr));gap:12px}.form-grid .span2{grid-column:span 2}.form-grid .span3{grid-column:1/-1}.metric-grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:18px 30px}.metric .label{font-size:11px;color:#00995e;font-weight:700}.metric .value{font-size:16px;font-weight:800;margin-top:6px}
.table-wrap{overflow:auto;border:1px solid #9ea7b3;background:#fff}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:6px 7px;text-align:left;font-size:12px;white-space:nowrap}.table th{background:#fff;font-weight:700;position:sticky;top:0;z-index:1}.table tbody tr{background:#fff}.table tbody tr:hover td{background:#f7f9fc}.table tbody tr.selected td{background:#0d7ed9;color:#fff}.status{font-weight:700}.status.good{color:var(--green)}.status.warn{color:var(--amber)}.status.bad{color:var(--red)}.actions{display:flex;gap:7px;flex-wrap:wrap}.progressbar{height:7px;background:#e8edf3;border-radius:99px;overflow:hidden;min-width:70px;display:inline-block;width:80px;vertical-align:middle}.progressbar i{display:block;height:100%;background:#2f6fed}
.modal-backdrop{position:fixed;inset:0;background:#10182877;display:grid;place-items:center;padding:20px;z-index:100}.modal{background:#fff;border:1px solid var(--line);border-radius:8px;width:min(760px,96vw);max-height:90vh;overflow:auto;padding:18px;box-shadow:0 24px 70px #0004}.modal h3{margin:0 0 14px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.check-list{border:1px solid var(--line);padding:10px;max-height:220px;overflow:auto}.check-list label{display:block;padding:5px 0}
.team-member-list{padding:8px 10px}
.team-member-list .team-member-row{display:grid;grid-template-columns:minmax(0,1fr) 28px;align-items:center;column-gap:12px;min-height:42px;padding:0 4px;border-bottom:1px solid #eef2f6;cursor:pointer}
.team-member-list .team-member-row:last-child{border-bottom:0}
.team-member-list .team-member-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;line-height:1.35}
.team-member-list .teamCheck{justify-self:center;width:16px;height:16px;margin:0;padding:0;cursor:pointer;accent-color:#2f6fed}
.smart-row{display:flex;gap:5px}.smart-row select,.smart-row input{flex:1;min-width:0}.notice{padding:10px 12px;border:1px solid #cbd5e1;background:#f8fafc;margin-bottom:12px;border-radius:5px}
.screenshot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.shot-card{background:#fff;border:1px solid var(--line);border-radius:7px;overflow:hidden;cursor:pointer}.shot-thumb{aspect-ratio:16/10;background:#edf1f6;display:grid;place-items:center;overflow:hidden}.shot-thumb img{width:100%;height:100%;object-fit:cover}.shot-meta{padding:9px;font-size:11px;display:flex;flex-direction:column;gap:3px}.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}.live-dot.green{background:#10a46f}.live-dot.gray{background:#98a2b3}.live-dot.red{background:#ef4444}.live-dot.amber{background:#f59e0b}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.two-col,.three-col{grid-template-columns:1fr}.metric-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.app-shell{grid-template-columns:1fr;grid-template-rows:38px auto 1fr;grid-template-areas:"title" "side" "main"}.sidebar{padding:6px;min-height:auto}.sidebar nav{display:flex;flex-direction:row;overflow:auto}.nav-btn{width:auto;white-space:nowrap}.sidebar-bottom{display:none}.content-head{padding:14px}.page{padding:6px 14px 20px}.kpis{grid-template-columns:repeat(2,1fr)}.form-grid,.metric-grid{grid-template-columns:1fr}.form-grid .span2{grid-column:auto}}

/* Web 4.27 - layout hardening: never overlap, scroll/wrap instead */
html,body,#app{max-width:100%;overflow-x:hidden}
.main,.page,.content-head,.content-head>div,.head-actions,.card,.toolbar,.field,.form-grid>*{min-width:0}
.content-head{flex-wrap:wrap}
.content-head>div:first-child{flex:1 1 280px;max-width:100%}
.head-actions{flex:0 1 auto;justify-content:flex-end}
.title-brand{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.toolbar>*{max-width:100%}
.toolbar .field{flex:0 1 240px}
.toolbar .field.grow,.toolbar .grow{flex:1 1 260px}
.field input,.field select,.field textarea{width:100%;max-width:100%;min-width:0}
.smart-row{flex-wrap:wrap}
.smart-row>*{min-width:min(150px,100%)}
.tabbar{max-width:100%;overflow-x:auto;overflow-y:hidden;flex-wrap:nowrap;scrollbar-gutter:stable;overscroll-behavior-x:contain}
.tab-btn{flex:0 0 auto}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(150px,100%),1fr))!important}
.two-col{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.grid.three-col{grid-template-columns:repeat(auto-fit,minmax(min(340px,100%),1fr))!important}
.grid.three-col>.card{min-width:0!important}
.task-card-top,.task-card-foot,.task-cards-head{flex-wrap:wrap}
.task-card-name,.task-card-meta,.notice,.user-summary{max-width:100%;overflow-wrap:anywhere}
.task-card-grid>div{min-width:0;overflow:hidden}

.table-wrap{width:100%;max-width:100%;min-width:0;overflow-x:auto!important;overflow-y:auto;overscroll-behavior-x:contain;isolation:isolate}
.table{width:max-content!important;min-width:100%!important;max-width:none!important;table-layout:auto!important}
.table th,.table td{position:relative;min-width:72px;max-width:340px;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important;vertical-align:middle}
.table th>*:not(button),.table td>*:not(button){max-width:100%}
.table td:has(>button),.table td:has(.actions),.table td.actions{min-width:160px;max-width:280px;white-space:normal!important;overflow:hidden!important;text-overflow:clip!important;height:auto!important;line-height:1.45}
.table td:has(>button) button,.table td .actions button{margin:2px 3px 2px 0;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.table .progressbar{max-width:calc(100% - 38px)}
button{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.modal{max-width:calc(100vw - 24px)}
.modal-actions{flex-wrap:wrap;row-gap:8px}

/* Long operational tables keep their intended column widths and scroll horizontally. */
.production-daily-table,.task-management-table,.my-tasks-table,.all-tasks-table,.task-management-all{table-layout:fixed!important}
.production-daily-table th,.production-daily-table td,
.task-management-table th,.task-management-table td,
.my-tasks-table th,.my-tasks-table td,
.all-tasks-table th,.all-tasks-table td,
.task-management-all th,.task-management-all td{max-width:none}

#page-employees .table th:nth-child(4),#page-employees .table td:nth-child(4){min-width:210px;max-width:300px}
#page-employees .table th:last-child,#page-employees .table td:last-child{min-width:180px;max-width:260px;white-space:normal!important}

@media(max-width:760px){
  .content-head{align-items:stretch}
  .head-actions{width:100%;justify-content:flex-start}
  .toolbar .field,.toolbar .field.grow,.toolbar .grow{flex:1 1 100%}
  .task-card-grid{grid-template-columns:1fr!important}
  .form-grid{grid-template-columns:1fr!important}
  .form-grid .span2,.form-grid .span3{grid-column:auto!important}
  .grid.three-col{grid-template-columns:1fr!important}
}



/* Web 4.28 - Dashboard page aligned closer to Desktop app */
body.dashboard-mode .content-head{display:none}
#page-dashboard{padding:14px 24px 28px}
.dashboard-classic{display:flex;flex-direction:column;gap:12px}
.dashboard-page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px}
.dashboard-page-head h2{margin:0;font-size:24px;line-height:1.1;font-weight:800;color:#0f172a}
.dashboard-page-sub{margin-top:4px;font-size:13px;color:#334155}
.dashboard-page-head .primary{padding:8px 16px;border-radius:2px}
.dashboard-filter-grid{display:grid;grid-template-columns:repeat(5,minmax(170px,1fr));gap:12px;align-items:end}
.dashboard-filter-grid .field label,.dashboard-filter-bottom .field label{font-size:11px;font-weight:800;color:#111827;margin-bottom:4px}

.dash-date-shell{display:grid;grid-template-columns:minmax(0,1fr) 16px minmax(0,1fr);gap:7px;align-items:center;background:#fff}
.dash-date-part{display:flex;align-items:center;border:1px solid #aeb7c4;border-radius:6px;background:#fff;min-width:0;height:34px;overflow:hidden}
.dashboard-filter-grid .field .dash-date-input{border:0!important;border-radius:0!important;box-shadow:none!important;background:transparent!important;padding:6px 7px!important;min-height:32px!important;min-width:0!important;width:100%!important;font-size:13px;color:#111827;outline:0}
.dash-date-input::placeholder{color:#64748b;opacity:1}
.dash-calendar-btn{border:0!important;background:transparent!important;color:#344054!important;padding:0 7px!important;min-width:30px!important;width:30px!important;height:32px!important;display:grid;place-items:center;flex:0 0 30px;border-radius:0!important}
.dash-calendar-btn:hover{background:#f3f6fb!important}
.dash-calendar-btn svg{width:15px;height:15px;display:block;pointer-events:none}
.dash-date-sep{text-align:center;font-weight:700;color:#475467;line-height:1}
.dashboard-filter-bottom{display:grid;grid-template-columns:minmax(260px,1fr) 320px;gap:16px;align-items:end}
.dashboard-update-info{font-size:13px;color:#111827;padding-top:2px}
.dash-search-field{justify-self:end;width:100%;max-width:320px}
.dashboard-kpis{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:8px}
.dashboard-kpi{background:#fff;border:1px solid #d6dde8;border-radius:12px;padding:12px 14px;min-height:78px;position:relative;overflow:hidden}
.dashboard-kpi::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:#2f6fed}
.dashboard-kpi.amber::before{background:#e49a12}
.dashboard-kpi.red::before{background:#e23b49}

.dashboard-kpi.blue2::before{background:#6ea3ff}
.dashboard-kpi-label{font-size:12px;color:#1f2937;margin-bottom:10px}
.dashboard-kpi-value{font-size:23px;font-weight:800;color:#0f172a}
.dashboard-block{display:flex;flex-direction:column;gap:6px}
.dashboard-bottom-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:stretch}
.dashboard-block-title{font-size:15px;font-weight:800;color:#4f7cff}
.dashboard-block.small .dash-table-wrap,.dashboard-block.small .dash-chart{min-height:294px}
.dash-table-wrap{border:1px solid #8f99a6;border-radius:0;background:#fff;overflow:auto}
.dash-table{width:max-content!important;min-width:100%!important;border-collapse:collapse;table-layout:auto!important}
.dash-table th,.dash-table td{font-size:12px;padding:5px 6px;border-right:1px solid #dbe2ea;border-bottom:1px solid #dbe2ea;white-space:nowrap!important;vertical-align:middle;max-width:none!important;overflow:visible!important;text-overflow:clip!important}
.dash-table th{background:#fff;color:#111827;font-weight:700;position:sticky;top:0;z-index:1}
.dash-table td .project-link{font-weight:400}
.dash-small-table th,.dash-small-table td{font-size:12px}
.dash-inline-metric{display:flex;align-items:center;gap:8px;min-width:110px}
.dash-inline-metric b{font-weight:700;color:#111827}
.dash-mini-bar{width:80px;height:10px;border-radius:1px;background:#edf1f5;display:inline-block;overflow:hidden;border:1px solid #e6ebf1}
.dash-mini-bar i{display:block;height:100%;background:#3f7cff}
.dash-mini-bar.dash-budget i{background:#34b36b}
.dash-status{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.dash-status.good{color:#0f9f63}
.dash-status.warn{color:#111827}
.dash-status.bad{color:#d92f42}
.dash-status.neutral{color:#111827}
.dash-status-dot{font-size:11px;line-height:1}
.dash-chart{border:1px solid #8f99a6;background:#fff;min-height:294px;padding:12px 14px}
.dash-chart-legend{display:flex;gap:28px;align-items:center;margin-bottom:18px;font-size:12px;color:#111827;flex-wrap:wrap}
.dash-chart-legend .swatch{display:inline-block;width:10px;height:10px;margin-right:6px;vertical-align:middle}
.dash-chart-legend .swatch.est{background:#7fa7ff}
.dash-chart-legend .swatch.used{background:#316df1}
.dash-chart-row{display:grid;grid-template-columns:130px minmax(0,1fr);gap:10px;align-items:center;margin:22px 0}
.dash-chart-name{font-size:12px;color:#111827;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dash-chart-name .project-link{font-size:12px;font-weight:400;color:#0b5bd3;cursor:pointer}
.project-link{position:relative;z-index:2;pointer-events:auto!important}
.dash-chart-bars{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.dash-chart-track{position:relative;height:30px}
.dash-chart-bar{height:9px;border-radius:1px}
.dash-chart-bar.est{background:#7fa7ff;position:absolute;top:2px;left:0}
.dash-chart-bar.used{background:#316df1;position:absolute;top:16px;left:0}
.dash-chart-values{font-size:12px;color:#111827;min-width:48px;text-align:left;line-height:1.4}
@media(max-width:1400px){.dashboard-kpis{grid-template-columns:repeat(3,minmax(130px,1fr))}.dashboard-filter-grid{grid-template-columns:repeat(3,minmax(170px,1fr))}.dashboard-filter-bottom{grid-template-columns:1fr}.dash-search-field{justify-self:start;max-width:360px}.dashboard-bottom-row{grid-template-columns:1fr}}
@media(max-width:900px){#page-dashboard{padding:12px 14px 20px}.dashboard-page-head{flex-wrap:wrap}.dashboard-filter-grid{grid-template-columns:1fr 1fr}.dash-date-range{grid-template-columns:1fr}.dashboard-kpis{grid-template-columns:1fr 1fr}.dash-chart-row{grid-template-columns:1fr}.dash-chart-name{white-space:normal}.dashboard-bottom-row{grid-template-columns:1fr}}

/* Web 4.41 - App/Web feature parity audit */
.auto-tag{color:#00995e;font-weight:700}.manual-tag{color:#667085;font-weight:500}.progress-mode-row{display:flex;align-items:center;gap:12px}.progress-mode-row>input[type=number]{min-width:120px;max-width:220px}.check-inline{display:flex!important;flex-direction:row!important;align-items:center;gap:6px;white-space:nowrap}.check-inline input{min-width:auto!important}.project-progress-field{min-width:320px}.total-row td{background:#f8fafc;font-weight:700}.production-filters{align-items:flex-end}.production-filters .field select,.production-filters .field input{min-width:135px}



/* Web 4.42 - Manager Operations Monitor */
.manager-monitor{display:flex;flex-direction:column;gap:14px}
.manager-monitor-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}

.manager-monitor-filters .field{min-width:150px}
.manager-monitor-kpis{display:grid;grid-template-columns:repeat(6,minmax(125px,1fr));gap:10px}
.manager-kpi{background:#fff;border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:8px;padding:12px 13px;min-height:76px}

/* Web 4.56 - unified native calendar format.
   All date fields now use the browser-native calendar (Sunday-first in en-US)
   and the same MM/DD/YYYY presentation shown in the reference image. */
input[type="date"],input[type="month"]{color-scheme:light;min-height:34px}
input[type="date"]::-webkit-calendar-picker-indicator,input[type="month"]::-webkit-calendar-picker-indicator{cursor:pointer}
.dash-date-shell{grid-template-columns:minmax(150px,1fr) 16px minmax(150px,1fr) auto!important}
.dash-date-part{border:0!important;height:34px!important;overflow:visible!important}
.dashboard-filter-grid .field .dash-date-input{border:1px solid #aeb7c4!important;border-radius:6px!important;background:#fff!important;padding:6px 8px!important;height:34px!important}
/* Web 4.55 - global control/text alignment sweep */
:root{--ddg-control-h:36px;--ddg-label-h:18px}
.toolbar,.head-actions,.management-actions,.modal-actions,.actions{
  align-items:center;
}
.toolbar{align-items:flex-end}
.field{display:flex;flex-direction:column;justify-content:flex-end}
.field>label{
  display:flex;align-items:flex-end;
  min-height:var(--ddg-label-h);
  line-height:var(--ddg-label-h);
  margin:0 0 5px 0;
}
.toolbar .field>input:not([type=checkbox]):not([type=radio]),
.toolbar .field>select,
.head-actions>input:not([type=checkbox]):not([type=radio]),
.head-actions>select,
.modal .field>input:not([type=checkbox]):not([type=radio]),
.modal .field>select,
.management-board .field>input:not([type=checkbox]):not([type=radio]),
.management-board .field>select{
  height:var(--ddg-control-h);
  min-height:var(--ddg-control-h);
  margin:0;
  line-height:1.2;
}
.toolbar>button,
.head-actions>button,
.management-actions>button,
.modal-actions>button{
  height:var(--ddg-control-h);
  min-height:var(--ddg-control-h);
  display:inline-flex;align-items:center;justify-content:center;
  margin:0;
}
.smart-row{align-items:center}
.smart-row>input:not([type=checkbox]):not([type=radio]),
.smart-row>select,
.smart-row>button{min-height:var(--ddg-control-h)}
.content-head{align-items:flex-start}
.content-head .head-actions{min-height:var(--ddg-control-h)}
.table th,.table td{line-height:1.25}
.table th{vertical-align:middle}
.table td{vertical-align:middle}
@media(max-width:760px){
  .toolbar .field,.toolbar .field.grow,.toolbar .grow{width:100%}
}

/* Web 4.58 - global people-name + no-overlap hardening */
.table th,.table td{overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important;vertical-align:middle!important}
.table th>* ,.table td>*{max-width:100%;box-sizing:border-box}

.task-detail-kind{display:inline-flex;align-items:center;gap:6px;border:1px solid #e4e7ec;border-radius:7px;padding:5px 9px;color:#344054;background:#fff;font-size:12px;margin-bottom:14px}

      function pById(id){return state.projects.find(x=>x.id===id)} function tById(id){return state.tasks.find(x=>x.id===id)} function prof(id){return state.profiles.find(x=>x.id===id)} function looksLikeInternalId(v){v=String(v||'').trim();return /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(v)} function safePersonName(display,employee,email){for(const v of [display,employee,email]){const s=String(v||'').trim();if(s&&!looksLikeInternalId(s))return s}return'Employee'} function nameOf(id){const p=prof(id);return safePersonName(p?.display_name,p?.employee_id,p?.email)}

      function effectiveEntryHours(x){const now=Date.now();if(num(x.duration_seconds)>0)return num(x.duration_seconds)/3600;if(!x.started_at)return 0;const start=new Date(x.started_at).getTime();if(x.ended_at)return Math.max(0,(new Date(x.ended_at).getTime()-start)/3600000);let end=now;if(x.updated_at){const hb=new Date(x.updated_at).getTime();if(Number.isFinite(hb)&&now-hb>30000)end=hb}return Math.max(0,(end-start)/3600000)}

      async function loginWithRestFallback(email,password){
        const ctrl=new AbortController();
        const timer=setTimeout(()=>ctrl.abort(),20000);
        try{
          const r=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{
            method:'POST',
            signal:ctrl.signal,
            headers:{
              'apikey':SUPABASE_KEY,
              'Authorization':`Bearer ${SUPABASE_KEY}`,
              'Content-Type':'application/json'
            },
            body:JSON.stringify({email,password})
          });
          const raw=await r.text();
          let body={};
          try{body=raw?JSON.parse(raw):{}}catch{body={message:raw}}
          if(!r.ok){
            const m=body?.msg||body?.message||body?.error_description||body?.error||`HTTP ${r.status}`;
            throw new Error(`Supabase Auth: ${m} (HTTP ${r.status})`);
          }
          if(!body.access_token||!body.refresh_token) throw new Error('Supabase Auth returned no session token.');
          const {data,error}=await sb.auth.setSession({access_token:body.access_token,refresh_token:body.refresh_token});
          if(error) throw error;
          return data;
        }finally{clearTimeout(timer)}
      }
      
      $('#loginBtn').onclick=async()=>{

        const password=$('#loginPassword').value;
        msg.textContent='';
        if(!email||!password){msg.textContent='Please enter email and password.';return;}
        btn.disabled=true; btn.textContent='Signing in...';
        try{
          let data=null;
          let sdkError=null;
          try{
            const result=await Promise.race([
              sb.auth.signInWithPassword({email,password}),
              new Promise((_,reject)=>setTimeout(()=>reject(new Error('Supabase SDK login timed out.')),15000))
            ]);
            if(result?.error) sdkError=result.error; else data=result?.data||null;
          }catch(e){sdkError=e}
      
          if(!data?.user){
            console.warn('Supabase SDK login failed; trying direct Auth REST endpoint.',sdkError);
            msg.textContent='Retrying authentication...';
            data=await loginWithRestFallback(email,password);
          }
          if(!data?.user){
            const {data:ud,error:ue}=await sb.auth.getUser();
            if(ue) throw ue;
            data={user:ud?.user};
          }
          if(!data?.user) throw new Error('Login succeeded but no user session was returned.');
          msg.textContent='Login successful. Loading data...';
          await showMain(data.user);
        }catch(e){
          console.error('Login error',e);
          msg.textContent=e?.name==='AbortError'?'Connection to Supabase timed out.':(e?.message||'Unable to connect to Supabase.');
        }finally{btn.disabled=false;btn.textContent='Login';}
      };

      function drawMonitorScreenshots(){if(window._managerMonitorTimer){clearTimeout(window._managerMonitorTimer);window._managerMonitorTimer=null}const scopeProjects=roleIsManager()?state.projects:managedProjects(),scopeIds=roleIsManager()?null:new Set(scopeProjects.flatMap(p=>monitorProjectUserIds(p.id))),people=state.profiles.filter(p=>p.active!==false).filter(p=>!scopeIds||scopeIds.has(p.id));const body=$('#monitorBody');if(!body)return;body.innerHTML=`<div class="toolbar"><div class="field"><label>Employee</label><select id="monEmp">${people.map(p=>`<option value="${p.id}">${esc(nameOf(p.id))} (${esc(p.employee_id||'')}) · ${esc(canonicalRole(p.role))}</option>`).join('')}</select></div><div class="field"><label>Date</label><input id="monDate" type="date" lang="en-US" value="${isoDay()}"></div><button id="monLoad" class="primary">Reload Screenshots</button></div><div id="monInfo" class="muted small"></div><div id="monShots" class="screenshot-grid" style="margin-top:12px"></div>`;$('#monLoad').onclick=loadMonitor;$('#monEmp').onchange=loadMonitor;$('#monDate').onchange=loadMonitor;loadMonitor()}

      function renderEmployees(){if(!canViewEmployees()){$('#page-employees').innerHTML='<div class="notice">Director / Manager access required.</div>';return}const rows=state.profiles,editable=canManageEmployees();$('#page-employees').innerHTML=`<div class="toolbar">${editable?'<button id="newEmployee">+ New Employee</button>':''}<div class="field grow"><label>Search</label><input id="empSearch" placeholder="Search employee..."></div>${!editable?'<div class="notice small">Manager view is read-only. Director/System Admin manages accounts and roles.</div>':''}</div><div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">${[['Directors',rows.filter(x=>canonicalRole(x.role)==='Director').length],['Managers',rows.filter(x=>canonicalRole(x.role)==='Manager').length],['Project Leads',rows.filter(x=>canonicalRole(x.role)==='Project Lead').length],['Employees',rows.filter(x=>canonicalRole(x.role)==='Employee').length]].map(([l,v])=>`<div class="kpi"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('')}</div><div class="table-wrap"><table class="table"><thead><tr><th>Employee</th><th>Employee ID</th><th>Group</th><th>Email</th><th>Role</th><th>System Admin</th><th>Annual Leave</th><th>Used</th><th>Remaining</th><th>Status</th>${editable?'<th>Action</th>':''}</tr></thead><tbody>${rows.map(p=>{const e=num(p.annual_leave_days),u=usedLeave(p.id);return`<tr data-emp-row data-search="${esc([p.display_name,p.employee_id,p.work_group,p.email,p.role].join(' ').toLowerCase())}"><td>${esc(nameOf(p.id))}</td><td>${esc(p.employee_id||'—')}</td><td>${esc(p.work_group||'—')}</td><td>${esc(p.email||'—')}</td><td>${esc(canonicalRole(p.role))}</td><td>${p.is_system_admin===true||String(p.role||'').toLowerCase()==='admin'?'Yes':'—'}</td><td>${fmt(e)}</td><td>${fmt(u)}</td><td>${fmt(Math.max(0,e-u))}</td><td>${p.active===false?'Inactive':'Active'}</td>${editable?`<td><button data-edit-emp="${p.id}">Edit</button> <button class="${p.active===false?'success':'danger'}" data-toggle-emp="${p.id}">${p.active===false?'Activate':'Deactivate'}</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`;if(editable){$('#newEmployee').onclick=()=>employeeModal();$$('[data-edit-emp]').forEach(b=>b.onclick=()=>employeeModal(prof(b.dataset.editEmp)));$$('[data-toggle-emp]').forEach(b=>b.onclick=()=>toggleEmployee(b.dataset.toggleEmp))}$('#empSearch').oninput=e=>{const q=e.target.value.toLowerCase();$$('[data-emp-row]').forEach(r=>r.classList.toggle('hidden',q&&!r.dataset.search.includes(q)))}}
      async function createAuthEmployee(email,password,metadata){const temp=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});const {data,error}=await temp.auth.signUp({email,password,options:{data:metadata}});try{await temp.auth.signOut()}catch{}if(error)throw error;return data.user}
      async function employeeModal(p=null){
        if(!canManageEmployees())return alert('Only Director/System Admin can manage employee accounts.');
        let previewProfiles=state.profiles;
        if(!p){try{const {data}=await sb.from('profiles').select('employee_id,work_group');if(data)previewProfiles=data}catch(_){}}
        const initialGroup=String(p?.work_group||'DN').trim().toUpperCase();
        const initialId=p?.employee_id||nextEmployeeId(initialGroup,previewProfiles),initialRole=canonicalRole(p?.role||'Employee');
        modal(p?'Edit Employee':'New Employee',`<div class="form-grid"><div class="field"><label>Display Name</label><input id="eName" value="${esc(p?.display_name||'')}"></div><div class="field"><label>Employee ID</label><input id="eId" value="${esc(initialId)}" ${p?'':'readonly'}></div><div class="field"><label>Group</label><input id="eGroup" list="employeeGroupList" placeholder="DN, TH, TN, PT, TD or type another" value="${esc(initialGroup)}"><datalist id="employeeGroupList"><option value="DN"><option value="TH"><option value="TN"><option value="PT"><option value="TD"></datalist></div><div class="field"><label>Email</label><input id="eEmail" type="email" value="${esc(p?.email||'')}" ${p?'readonly':''}></div><div class="field"><label>Organization Role</label><select id="eRole">${ORG_ROLES.map(r=>`<option value="${r}" ${initialRole===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label>Annual Leave Days</label><input id="eLeave" type="number" step="0.5" min="0" value="${num(p?.annual_leave_days)}"></div>${isSystemAdmin()?`<div class="field"><label>Technical Permission</label><label class="check-inline"><input id="eSystemAdmin" type="checkbox" ${(p?.is_system_admin===true||String(p?.role||'').toLowerCase()==='admin')?'checked':''}> System Admin</label></div>`:''}${p?'':`<div class="field"><label>Temporary Password</label><input id="ePass" type="password"></div><div class="field"><label>ID Rule</label><input readonly value="Group + next number (001, 002, ...)"></div>`}</div>`,async()=>{
          let uid=p?.id;
          const group=$('#eGroup').value.trim().toUpperCase();
          if(!employeeIdPrefix(group))return alert('Group is required before Employee ID can be assigned.');
          const row={display_name:$('#eName').value.trim(),employee_id:$('#eId').value.trim(),work_group:group,email:$('#eEmail').value.trim().toLowerCase(),role:$('#eRole').value,annual_leave_days:num($('#eLeave').value),active:p?.active!==false,is_system_admin:isSystemAdmin()?($('#eSystemAdmin')?.checked===true):(p?.is_system_admin===true)};
          if(!row.display_name)return alert('Display Name is required.');
          if(!row.email)return alert('Email is required.');
          if(!p){
            if(String($('#ePass').value||'').length<6)return alert('Temporary Password must be at least 6 characters.');
            try{row.employee_id=await freshNextEmployeeId(group);$('#eId').value=row.employee_id}catch(e){return alert(e?.message||String(e))}
            try{const u=await createAuthEmployee(row.email,$('#ePass').value,{display_name:row.display_name,employee_id:row.employee_id,work_group:row.work_group});uid=u?.id}catch(e){return alert(e.message)}
          }
          if(!row.employee_id)return alert('Employee ID is required.');
          for(let i=0;i<8&&!p;i++){const {data}=await sb.from('profiles').select('id').eq('id',uid).maybeSingle();if(data)break;await new Promise(r=>setTimeout(r,250))}
          const {error}=await sb.from('profiles').update(row).eq('id',uid);if(error)return alert(error.message);closeModal();await loadAll();
        });
        if(!p){const groupInput=$('#eGroup'),idInput=$('#eId');const updatePreview=()=>{idInput.value=nextEmployeeId(groupInput.value,previewProfiles)};groupInput.addEventListener('input',updatePreview);groupInput.addEventListener('change',updatePreview);updatePreview()}
      }
      async function toggleEmployee(uid){if(!canManageEmployees())return alert('Only Director/System Admin can change employee status.');const p=prof(uid);if(!p)return;const active=p.active===false;if(!confirm(`${active?'Activate':'Deactivate'} ${nameOf(uid)}?`))return;const {error}=await sb.from('profiles').update({active}).eq('id',uid);if(error)return alert(error.message);await loadAll()}
      function renderSettings(){$('#page-settings').innerHTML=`<div class="card" style="max-width:900px"><div class="section-title">Web Portal Settings</div><div class="notice">Tracking capture settings remain in the Windows desktop agent because a browser cannot monitor global keyboard/mouse activity, detect all desktop applications, or capture the entire desktop in the background.</div><div class="form-grid"><div class="field"><label>Supabase</label><input readonly value="Connected"></div><div class="field"><label>Portal</label><input readonly value="DDG Tracking Web"></div><div class="field"><label>Signed screenshot URL lifetime</label><input readonly value="10 minutes"></div></div></div>`}
      function renderAbout(){$('#page-about').innerHTML=`<div class="card" style="max-width:900px"><div class="section-title">DDG Tracking Web</div><p>Management portal synchronized with the DDG Tracking Windows App through Supabase.</p><p><b>Organization roles:</b> Director, Manager, Project Lead and Employee. System Admin is a separate technical permission.</p><p><b>Web:</b> executive/management dashboards, Action Center, Project/Task/Change Order management, Operations Monitor, attendance/leave and employee administration by permission.</p><p><b>Windows App:</b> personal Start/Stop tracking for Manager, Project Lead and Employee, plus role-scoped project/task workflows.</p><p class="muted">Version Web 4.69 Double-click ClickUp-style Task Details Editor</p></div>`}
      
      async function bootstrapAuth(){
        try{
          const {data,error}=await sb.auth.getSession();
          if(error) console.warn('Session restore error',error);
          if(data?.session?.user) await showMain(data.session.user);
        }catch(e){console.error('Auth bootstrap error',e);}
      }
      sb.auth.onAuthStateChange((event,session)=>{
        console.log('Auth state:',event);
        if(event==='SIGNED_OUT'){
          $('#mainView')?.classList.add('hidden');
          $('#loginView')?.classList.remove('hidden');
        }
      });
      bootstrapAuth();
      if (loginMsg() && loginMsg().textContent === 'Loading authentication...') setMsg('');
    } catch (e) {
      console.error(e);
      setMsg('Web app failed to start: ' + (e?.message || String(e)));
    }
  }
  boot();
})();
</script>
